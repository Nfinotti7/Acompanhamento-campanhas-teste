<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Eventos — Recreio Bar</title>
<style>
  :root { --bg:#f7f8fa; --fg:#1d2433; --muted:#5b6475; --wa:#1fa855; --wa-hover:#178a45; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; background:var(--bg); color:var(--fg); font:17px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { width:100%; max-width:440px; padding:32px 16px; text-align:center; }
  .casa { font-size:.85rem; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); margin:0 0 12px; }
  h1 { font-size:1.5rem; line-height:1.25; margin:0 0 12px; }
  p { margin:0 0 28px; color:var(--muted); }
  a.btn { display:block; padding:18px 20px; border-radius:14px; background:var(--wa); color:#fff; font-weight:600; font-size:1.1rem; text-decoration:none; }
  a.btn:hover, a.btn:focus-visible { background:var(--wa-hover); }
  .num { margin-top:16px; font-size:.9rem; color:var(--muted); }
  .priv { margin-top:32px; font-size:.8rem; }
  .priv a { color:var(--muted); }
</style>
</head>
<body>
<main>
  <p class="casa">Recreio Bar</p>
  <h1>Recebemos seus dados! Falta só um passo.</h1>
  <p>Chame a equipe de eventos no WhatsApp para receber o orçamento e as condições para a sua empresa.</p>
  <a class="btn" href="https://api.whatsapp.com/send?phone=556292414052&text=Ol%C3%A1%21%20Preenchi%20o%20formul%C3%A1rio%20e%20quero%20um%20or%C3%A7amento%20para%20a%20confraterniza%C3%A7%C3%A3o%20da%20minha%20empresa%20no%20Recreio.">Falar no WhatsApp</a>
  <div class="num">Equipe de eventos · (62) 9241-4052</div>
  <div class="priv"><a href="/privacidade.html">Política de privacidade</a></div>
</main>
</body>
</html>
